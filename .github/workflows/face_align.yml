name: face-align-compare
on:
  workflow_dispatch:
    inputs:
      long_side: { description: 'detection long side', default: '480' }
jobs:
  align:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: python -m pip install -q "numpy<2" "opencv-python-headless<4.12" onnxruntime==1.17.1 scikit-learn pillow
      - name: models (OpenCV Zoo 공식 ONNX = 제품 CDN 과 같은 파일)
        run: |
          mkdir -p m
          curl -sSfL -o m/yunet_2026may.onnx https://downloads.grablo.co/assets/vision/yunet_2026may.onnx
          curl -sSfL -o m/face_recognition_sface_2021dec.onnx https://downloads.grablo.co/assets/vision/face_recognition_sface_2021dec.onnx
          sha256sum m/*.onnx
      - run: python face_align_compare.py m out ${{ inputs.long_side }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: face-align-${{ inputs.long_side }}
          path: out/face_align_compare.json
